<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc" xml:space="preserve">
  <title id="title">petfetch — Kimi 娘桌宠信息</title>
  <desc id="desc">终端风格的桌宠信息卡片，左侧是蓝色小桌宠 Unicode 文字画，右侧包含版本、动作、帧数、许可和互动方式</desc>
  <rect x="10" y="10" width="1080" height="480" rx="28" fill="#262238" stroke="#6c5c91" stroke-width="2"/>
  <rect x="10" y="10" width="1080" height="58" rx="28" fill="#342d4a"/>
  <circle cx="48" cy="39" r="8" fill="#ff8fa8"/>
  <circle cx="76" cy="39" r="8" fill="#f5cf74"/>
  <circle cx="104" cy="39" r="8" fill="#91d9ae"/>
  <text x="550" y="47" text-anchor="middle" fill="#c9bce2" font-size="20" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">~/little-moon-pet</text>
  <text x="46" y="112" fill="#b8a2e3" font-size="25" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">kimi@desktop:~$ petfetch</text>

  <g id="unicode-moon-pet" font-family="ui-monospace,SFMono-Regular,Menlo,'Hiragino Kaku Gothic ProN','Yu Gothic',monospace" text-anchor="middle">
    <text x="323" y="154" fill="#c4b0ec" font-size="36">☾</text>
    <text x="114" y="166" fill="#8fa9e8" font-size="23">✦</text>
    <text x="338" y="214" fill="#8778a6" font-size="17">·</text>
    <text x="220" y="367" fill="#7fa9ff" font-size="220">●</text>
    <style>
      .pet-eyes-open { opacity: 1; animation: pet-open 5.2s step-end infinite; }
      .pet-eyes-closed { opacity: 0; animation: pet-shut 5.2s step-end infinite; }
      @keyframes pet-open {
        0%, 90%, 96%, 100% { opacity: 1; }
        92%, 94% { opacity: 0; }
      }
      @keyframes pet-shut {
        0%, 90%, 96%, 100% { opacity: 0; }
        92%, 94% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pet-eyes-open { animation: none; opacity: 1; }
        .pet-eyes-closed { display: none; }
      }
    </style>
    <g class="pet-eyes-open" fill="#29314c" font-size="27" font-weight="700">
      <text x="200" y="285">▪</text>
      <text x="240" y="285">▪</text>
    </g>
    <g class="pet-eyes-closed" fill="#29314c" font-size="27" font-weight="700">
      <text x="200" y="285">─</text>
      <text x="240" y="285">─</text>
    </g>
    <text x="220" y="405" fill="#c4b0ec" font-size="29" font-weight="700">K</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="25">
    <text x="455" y="174" fill="#b8a2e3">name       <tspan fill="#f3ecff">Kimi 娘 · Q 版</tspan></text>
    <text x="455" y="216" fill="#b8a2e3">version    <tspan fill="#f3ecff">1.0.0</tspan></text>
    <text x="455" y="258" fill="#b8a2e3">actions    <tspan fill="#f3ecff">9 (8 standard + flute)</tspan></text>
    <text x="455" y="300" fill="#b8a2e3">frames     <tspan fill="#f3ecff">68 · 256 × 288 px</tspan></text>
    <text x="455" y="342" fill="#b8a2e3">art        <tspan fill="#f3ecff">CC BY-NC 4.0</tspan></text>
    <text x="455" y="384" fill="#b8a2e3">code       <tspan fill="#f3ecff">MIT</tspan></text>
    <text x="455" y="426" fill="#b8a2e3">click      <tspan fill="#f3ecff">flute time ♪</tspan></text>
  </g>
  <text x="46" y="463" fill="#8778a6" font-size="19" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">tip: 保留署名，非商业分享；给别的机器也带一点月光。</text>
</svg>
